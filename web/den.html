<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>den</title>
<link rel="icon" id="icon" href="data:,">
<link rel="stylesheet" href="static/den.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="app" id="app">
  <header class="top glass" id="top">
    <div class="brand"><canvas id="emberTop" width="26" height="17" aria-hidden="true"></canvas><b>den</b></div>
    <button class="folder" id="folderBtn" type="button" title="The folder den has open"><span id="folderName"></span></button>
    <button class="cmdbar" id="cmdBar" type="button" aria-label="Find a file or a command">
      <span class="ic" data-icon="search"></span><span class="txt">Find a file, or type <b>&gt;</b> for commands</span><kbd id="cmdKey"></kbd>
    </button>
    <div class="acts">
      <button class="tool" id="tSide" type="button" data-icon="sidebar" title="Show or hide the side bar"></button>
      <button class="tool" id="tPanel" type="button" data-icon="panel" title="Show or hide the console and terminal"></button>
      <button class="tool" id="tHelp" type="button" data-icon="helper" title="Show or hide Ember"></button>
      <button class="run" id="runBtn" type="button" disabled><span class="ic" data-icon="play"></span><span id="runText">Run</span></button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Views">
    <button type="button" data-view="files" data-icon="files" title="Files" aria-label="Files"></button>
    <button type="button" data-view="search" data-icon="search" title="Search every file" aria-label="Search"></button>
    <button type="button" data-view="git" data-icon="git" title="Changes (git)" aria-label="Changes"><span class="count" id="gitCount" hidden></span></button>
    <button type="button" data-view="outline" data-icon="outline" title="Outline of this file" aria-label="Outline"></button>
    <span class="grow"></span>
    <button type="button" id="emberRail" data-icon="spark" title="Ember (your helper)" aria-label="Ember"></button>
    <button type="button" id="settingsRail" data-icon="gear" title="Settings" aria-label="Settings"></button>
  </nav>

  <aside class="side glass" id="side" aria-label="Side bar">
    <div class="side-head"><h2 id="sideTitle">Files</h2><span class="grow"></span><span class="side-acts" id="sideActs"></span></div>
    <div class="side-body" id="sideBody"></div>
  </aside>
  <div class="split v" data-split="side"></div>

  <main class="work" id="work">
    <div class="groups" id="groups"></div>
    <div class="split h" data-split="panel"></div>
    <section class="panel glass" id="panel" aria-label="Console, terminal and problems">
      <div class="ptabs" role="tablist" id="ptabs">
        <button type="button" role="tab" data-p="console"><span class="ic" data-icon="console"></span>Console</button>
        <button type="button" role="tab" data-p="terminal"><span class="ic" data-icon="terminal"></span>Terminal</button>
        <button type="button" role="tab" data-p="problems"><span class="ic" data-icon="problem"></span>Problems <span class="count" id="probCount" hidden></span></button>
        <span class="grow"></span>
        <span class="pacts" id="pacts"></span>
      </div>
      <div class="pbody" data-pb="console">
        <div class="out" id="out" aria-live="polite"></div>
        <form class="cmd" id="cmdForm"><span>›</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Type a command, or an answer for a running program"></form>
      </div>
      <div class="pbody" data-pb="terminal" hidden>
        <div class="tterms" id="tterms"></div>
        <div class="tbox" id="tbox"></div>
      </div>
      <div class="pbody" data-pb="problems" hidden><div class="plist" id="plist"></div></div>
    </section>
  </main>
  <div class="split v" data-split="helper"></div>

  <aside class="helper glass" id="helpBox" aria-label="Ember">
    <div class="ember"><canvas id="emberBig" width="26" height="17" aria-hidden="true"></canvas><div class="bubble" id="bubble" aria-live="polite"></div></div>
    <div class="htabs" role="tablist">
      <button type="button" role="tab" id="tabWhat" aria-selected="true">What's this?</button>
      <button type="button" role="tab" id="tabAsk" aria-selected="false">Ask</button>
    </div>
    <div class="hpane" id="whatPane"></div>
    <div class="hpane" id="askPane" hidden><div class="chat" id="chat"></div></div>
    <form class="ask" id="askForm" hidden>
      <div class="chips" id="chips"></div>
      <textarea id="askQ" rows="2" placeholder="Ask Ember anything about your code" aria-label="Your question for Ember"></textarea>
      <div class="send"><span class="grow" id="askModel"></span><button class="btn go" type="submit" id="askGo">Ask</button></div>
    </form>
  </aside>

  <footer class="status" id="status">
    <button type="button" class="pill" id="stBranch" hidden></button>
    <button type="button" class="pill" id="stSync" hidden></button>
    <button type="button" class="pill" id="stProblems"></button>
    <span class="grow" id="stMsg"></span>
    <button type="button" class="pill" id="stPos"></button>
    <button type="button" class="pill" id="stIndent"></button>
    <button type="button" class="pill" id="stLang"></button>
    <span class="pill quiet" id="stSaved"></span>
    <button type="button" class="pill" id="stAi" title="Which AI Ember uses"></button>
    <button type="button" class="pill" id="stTheme" title="Colours"></button>
    <button type="button" class="pill" id="stKeys" title="Keys">?</button>
  </footer>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="drop" id="drop" hidden><div><span data-icon="upload"></span><p>Drop to add these files to <b id="dropWhere"></b></p></div></div>

<script>window.DEN = __CONFIG__;</script>
<script src="static/icons.js"></script>
<script src="static/highlight.js"></script>
<script src="static/help.js"></script>
<script src="static/diff.js"></script>
<script src="static/editor.js"></script>
<script src="static/term.js"></script>
<script src="static/den.js"></script>
<script src="static/views.js"></script>
</body>
</html>
