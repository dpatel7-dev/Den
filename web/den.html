<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>den</title>
<link rel="icon" id="icon" href="data:,">
<link rel="stylesheet" href="static/den.css">
</head>
<body>
<header>
  <canvas id="emberTop" width="26" height="17" aria-hidden="true"></canvas>
  <h1>den <span class="dim">·</span> <span id="folderName"></span></h1>
  <span id="branch" class="dim wide-only"></span>
  <span class="rule"></span>
  <button class="icon narrow-only" id="filesToggle" type="button" title="Show the files">files</button>
  <button class="icon narrow-only" id="helpToggle" type="button" title="Show Ember">Ember</button>
  <button class="btn wide-only" id="quickBtn" type="button" title="Find any file by typing part of its name">Find a file <kbd class="mod">⌘P</kbd></button>
  <button class="btn go" id="runBtn" type="button" disabled>▶ Run</button>
  <button class="icon" id="menuBtn" type="button" aria-haspopup="menu" title="Everything den can do">☰</button>
</header>

<main id="main">
  <section class="box files" id="filesBox" aria-label="Files">
    <h2>Files</h2>
    <div class="ftools">
      <button class="icon" id="newFileBtn" type="button" title="New file (Alt+N)">+ file</button>
      <button class="icon" id="newDirBtn" type="button" title="New folder">+ folder</button>
      <span class="grow"></span>
      <button class="icon" id="binBtn" type="button" title="den's bin: things you deleted">bin</button>
    </div>
    <div class="tree" id="tree" role="tree" tabindex="0"></div>
  </section>
  <div class="split files" data-split="files"></div>

  <div class="mid" id="mid">
    <section class="box edbox" id="edBox" aria-label="Editor">
      <h2 id="edTitle">Welcome</h2>
      <span class="aside" id="edAside"></span>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="findbar" id="findbar" hidden>
        <input id="findQ" placeholder="find in this file" aria-label="Find in this file" autocomplete="off" spellcheck="false">
        <span class="n" id="findN"></span>
        <button class="icon" id="findPrev" type="button" title="Previous (Shift+Enter)">↑</button>
        <button class="icon" id="findNext" type="button" title="Next (Enter)">↓</button>
        <button class="icon" id="findCase" type="button" aria-pressed="false" title="Match capital letters">Aa</button>
        <input id="findR" placeholder="replace with" aria-label="Replace with" autocomplete="off" spellcheck="false">
        <button class="btn" id="findOne" type="button">Replace</button>
        <button class="btn" id="findAll" type="button">All</button>
        <button class="icon" id="findX" type="button" title="Close (Esc)">×</button>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="panes" id="panes">
        <div class="editor" id="editor" hidden>
          <div class="gutter"><div class="gin"></div></div>
          <div class="view">
            <div class="layer"><div class="curline"></div><div class="marks"></div><pre class="hl"></pre></div>
            <div class="complete" hidden></div>
          </div>
        </div>
        <div class="viewer" id="viewer"></div>
        <div class="pvsplit" id="pvsplit" hidden></div>
        <div class="preview" id="preview" hidden></div>
      </div>
    </section>
    <div class="split console" data-split="console"></div>
    <section class="box console" id="conBox" aria-label="Console">
      <h2>Console</h2>
      <span class="aside">
        <button class="icon" id="stopBtn" type="button" hidden title="Stop the program">■ stop</button>
        <button class="icon" id="clearBtn" type="button" title="Clear the console">clear</button>
      </span>
      <div class="out" id="out" aria-live="polite"></div>
      <form class="cmd" id="cmdForm"><span>›</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Type a command, or an answer for a running program"></form>
    </section>
  </div>
  <div class="split helper" data-split="helper"></div>

  <section class="box helper" id="helpBox" aria-label="Ember">
    <h2>Ember</h2>
    <div class="ember"><canvas id="emberBig" width="26" height="17" aria-hidden="true"></canvas><div class="bubble" id="bubble" aria-live="polite"></div></div>
    <div class="htabs" role="tablist">
      <button type="button" role="tab" id="tabWhat" aria-selected="true">What's this?</button>
      <button type="button" role="tab" id="tabAsk" aria-selected="false">Ask</button>
    </div>
    <div class="hpane" id="whatPane"></div>
    <div class="hpane" id="askPane" hidden><div class="chat" id="chat"></div></div>
    <form class="ask" id="askForm" hidden>
      <div class="chips" id="chips"></div>
      <textarea id="askQ" rows="2" placeholder="Ask Ember anything about your code" aria-label="Your question for Ember"></textarea>
      <div class="send"><span class="grow" id="askModel"></span><button class="btn go" type="submit" id="askGo">Ask</button></div>
    </form>
  </section>
</main>

<footer id="status">
  <span id="stLang"></span>
  <span id="stPos"></span>
  <span id="stIndent" class="wide-only"></span>
  <span id="stSaved"></span>
  <span class="grow" id="stMsg"></span>
  <button type="button" id="stKeys" class="wide-only">keys <kbd>?</kbd></button>
  <button type="button" id="stTheme" title="Light or dark">◐</button>
</footer>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>window.DEN = __CONFIG__;</script>
<script src="static/highlight.js"></script>
<script src="static/help.js"></script>
<script src="static/editor.js"></script>
<script src="static/den.js"></script>
</body>
</html>
